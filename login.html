<!DOCTYPE html>
<html lang="en" class="icons-pending">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SetAndForget – Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>
body{overscroll-behavior:none}
.icons-pending .material-symbols-outlined{display:inline-block;width:1em;overflow:hidden;white-space:nowrap;color:transparent!important}
:focus-visible{outline:2px solid #5046e5;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={theme:{extend:{
colors:{"surface":"#f8f9ff","surface-dim":"#cbdbf5","surface-container-lowest":"#ffffff","surface-container-low":"#eff4ff","surface-container":"#e5eeff","surface-container-high":"#dce9ff","surface-container-highest":"#d3e4fe","on-surface":"#0b1c30","on-surface-variant":"#464555","outline":"#777587","primary":"#3625cd","primary-container":"#5046e5","on-primary":"#ffffff","secondary":"#006c49","secondary-container":"#6cf8bb","on-secondary-container":"#00714d","secondary-fixed":"#6ffbbe","on-secondary-fixed":"#002113","tertiary":"#684000","tertiary-fixed":"#ffddb8","on-tertiary-fixed-variant":"#653e00","error":"#ba1a1a","on-error":"#ffffff","error-container":"#ffdad6","on-error-container":"#93000a","inverse-surface":"#213145","inverse-on-surface":"#eaf1ff"},
fontFamily:{"headline-xl":["Geist","Inter","sans-serif"],"headline-lg":["Geist","Inter","sans-serif"],"headline-md":["Geist","Inter","sans-serif"],"headline-sm":["Geist","Inter","sans-serif"],"body-md":["Inter","sans-serif"],"body-sm":["Inter","sans-serif"],"label-caps":["Inter","sans-serif"],"label-numeric":["JetBrains Mono","monospace"]},
fontSize:{"headline-xl":["40px",{lineHeight:"48px",letterSpacing:"-0.03em",fontWeight:"600"}],"headline-lg":["28px",{lineHeight:"34px",letterSpacing:"-0.02em",fontWeight:"600"}],"headline-md":["22px",{lineHeight:"28px",letterSpacing:"-0.015em",fontWeight:"600"}],"headline-sm":["18px",{lineHeight:"24px",letterSpacing:"-0.01em",fontWeight:"600"}],"body-md":["14px",{lineHeight:"20px"}],"body-sm":["12px",{lineHeight:"16px"}],"label-caps":["11px",{lineHeight:"14px",letterSpacing:"0.06em",fontWeight:"600"}],"label-numeric":["13px",{lineHeight:"16px",letterSpacing:"-0.02em",fontWeight:"500"}]}
}}}
</script>
</head>
<body class="bg-surface font-body-md text-body-md text-on-surface antialiased min-h-screen flex flex-col">

<header class="bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,.04)]">
  <div class="h-16 max-w-[1440px] mx-auto px-4 sm:px-6 flex items-center">
    <div class="flex items-center gap-2.5">
      <span class="w-8 h-8 rounded-lg bg-primary-container text-on-primary flex items-center justify-center"><span class="material-symbols-outlined text-xl">call_split</span></span>
      <span class="font-headline-sm text-headline-sm font-bold">SetAndForget</span>
    </div>
  </div>
</header>

<main class="flex-1 flex items-center justify-center px-4 py-10">
  <div class="w-full max-w-md">

    <div class="mb-6 text-center sm:text-left">
      <h1 id="title" class="font-headline-lg text-headline-lg">Welcome back</h1>
      <p id="subtitle" class="text-body-sm text-on-surface-variant mt-1">Sign in to track subscriptions and split bills with your roommates.</p>
    </div>

    <section class="rounded-xl bg-surface-container-lowest shadow-sm overflow-hidden" aria-label="Authentication">

      <!-- mode switch -->
      <div class="p-2 bg-surface-container-low">
        <div role="tablist" aria-label="Sign in or create account" class="grid grid-cols-2 gap-1">
          <button type="button" role="tab" id="tab-signin" data-mode="signin" aria-selected="true" class="tab px-3 py-2 rounded-lg text-sm font-semibold transition-colors">Sign in</button>
          <button type="button" role="tab" id="tab-signup" data-mode="signup" aria-selected="false" class="tab px-3 py-2 rounded-lg text-sm font-semibold transition-colors">Create account</button>
        </div>
      </div>

      <form id="form" class="p-5 sm:p-6 space-y-4" novalidate>

        <div id="msg" role="alert" aria-live="polite" class="hidden rounded-lg px-3 py-2.5 text-xs flex items-start gap-2">
          <span id="msg-icon" class="material-symbols-outlined text-base shrink-0">error</span>
          <span id="msg-text"></span>
        </div>

        <div id="name-wrap" class="hidden">
          <label for="fullName" class="block text-label-caps font-label-caps uppercase text-on-surface-variant mb-1">Full name</label>
          <input id="fullName" type="text" autocomplete="name" maxlength="100" placeholder="Your name" class="w-full px-3 py-2 bg-surface-container-low rounded-lg text-sm focus:outline-none focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary-container">
        </div>

        <div>
          <label for="email" class="block text-label-caps font-label-caps uppercase text-on-surface-variant mb-1">Email</label>
          <input id="email" type="email" autocomplete="email" inputmode="email" maxlength="255" placeholder="you@example.com" required class="w-full px-3 py-2 bg-surface-container-low rounded-lg text-sm focus:outline-none focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary-container">
        </div>

        <div>
          <div class="flex items-center justify-between mb-1">
            <label for="password" class="block text-label-caps font-label-caps uppercase text-on-surface-variant">Password</label>
            <button type="button" id="forgot" class="text-xs font-semibold text-primary hover:underline">Forgot password?</button>
          </div>
          <div class="relative">
            <input id="password" type="password" autocomplete="current-password" minlength="6" maxlength="72" placeholder="At least 6 characters" required class="w-full pl-3 pr-11 py-2 bg-surface-container-low rounded-lg text-sm focus:outline-none focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary-container">
            <button type="button" id="toggle-pw" aria-label="Show password" aria-pressed="false" class="absolute right-1 top-1/2 -translate-y-1/2 p-1.5 rounded-lg text-on-surface-variant hover:bg-surface-container-low hover:text-on-surface">
              <span id="toggle-icon" class="material-symbols-outlined text-xl">visibility</span>
            </button>
          </div>
        </div>

        <button id="submit" type="submit" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg bg-primary-container text-on-primary text-sm font-semibold hover:bg-primary transition-colors disabled:opacity-60 disabled:cursor-not-allowed">
          <span id="submit-spinner" class="hidden w-4 h-4 rounded-full border-2 border-white/40 border-t-white animate-spin" aria-hidden="true"></span>
          <span id="submit-label">Sign in</span>
        </button>

      </form>
    </section>

    <p class="text-body-sm text-on-surface-variant text-center mt-5">
      Your data stays private to your account. Only you can see your subscriptions and groups.
    </p>
  </div>
</main>

<div id="toasts" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(() => {
'use strict';

/* ------------------------------------------------------------------
   CONFIG – fill these in. Use the ANON (public) key, never service_role.
   Supabase dashboard → Project Settings → API.
------------------------------------------------------------------- */
const SUPABASE_URL      = 'https://rkttjaqrkuaypcnpxjeq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_YoCuU2MuUlHUmDqCFENV8g_5fsvT45y';
const AFTER_LOGIN_PAGE  = 'dashboard.html';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

let mode = 'signin';
let busy = false;

/* ---------- Supabase client ---------- */
const configured = !SUPABASE_URL.includes('YOUR-PROJECT') && !SUPABASE_ANON_KEY.includes('YOUR-ANON');
let sb = null;
try {
  if (configured && window.supabase) {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
  }
} catch (e) { sb = null; }

/* ---------- Redirect target (only same-folder .html pages) ---------- */
function nextPage() {
  const n = new URLSearchParams(location.search).get('next');
  return n && /^[\w\-]+\.html$/.test(n) ? n : AFTER_LOGIN_PAGE;
}

/* ---------- UI helpers ---------- */
function toast(msg, icon = 'check_circle') {
  const t = document.createElement('div');
  t.className = 'pointer-events-auto bg-inverse-surface text-inverse-on-surface px-4 py-3 rounded-xl shadow-lg flex items-center gap-2 text-xs transition-all duration-300 translate-y-4 opacity-0';
  t.innerHTML = `<span class="material-symbols-outlined text-sm text-secondary-fixed">${esc(icon)}</span><span>${esc(msg)}</span>`;
  $('toasts').appendChild(t);
  requestAnimationFrame(() => t.classList.remove('translate-y-4', 'opacity-0'));
  setTimeout(() => { t.classList.add('opacity-0'); setTimeout(() => t.remove(), 300); }, 3500);
}

function showMsg(text, kind = 'error') {
  const box = $('msg');
  box.className = 'rounded-lg px-3 py-2.5 text-xs flex items-start gap-2 ' +
    (kind === 'error' ? 'bg-error-container text-on-error-container' : 'bg-secondary-container text-on-secondary-container');
  $('msg-icon').textContent = kind === 'error' ? 'error' : 'check_circle';
  $('msg-text').textContent = text;
}
function clearMsg() { $('msg').className = 'hidden'; $('msg-text').textContent = ''; }

function setBusy(on, label) {
  busy = on;
  $('submit').disabled = on;
  $('forgot').disabled = on;
  $('submit-spinner').classList.toggle('hidden', !on);
  if (label) $('submit-label').textContent = label;
}

function setMode(next) {
  mode = next;
  const up = mode === 'signup';
  for (const t of document.querySelectorAll('.tab')) {
    const on = t.dataset.mode === mode;
    t.setAttribute('aria-selected', on);
    t.classList.toggle('bg-surface-container-lowest', on);
    t.classList.toggle('text-primary', on);
    t.classList.toggle('shadow-sm', on);
    t.classList.toggle('text-on-surface-variant', !on);
  }
  $('name-wrap').classList.toggle('hidden', !up);
  $('forgot').classList.toggle('hidden', up);
  $('password').autocomplete = up ? 'new-password' : 'current-password';
  $('title').textContent = up ? 'Create your account' : 'Welcome back';
  $('subtitle').textContent = up
    ? 'Start tracking subscriptions and splitting bills in a minute.'
    : 'Sign in to track subscriptions and split bills with your roommates.';
  $('submit-label').textContent = up ? 'Create account' : 'Sign in';
  clearMsg();
}

/* ---------- Friendly error text ---------- */
function friendly(err) {
  const m = String((err && err.message) || err || '').toLowerCase();
  if (m.includes('invalid login credentials')) return 'Incorrect email or password.';
  if (m.includes('email not confirmed'))      return 'Please confirm your email first. Check your inbox for the link.';
  if (m.includes('already registered') || m.includes('already been registered')) return 'An account with this email already exists. Try signing in.';
  if (m.includes('password should be'))       return 'Password is too weak. Use at least 6 characters.';
  if (m.includes('rate limit') || m.includes('too many')) return 'Too many attempts. Please wait a minute and try again.';
  if (m.includes('failed to fetch') || m.includes('network')) return 'Network error. Check your connection and try again.';
  return (err && err.message) ? err.message : 'Something went wrong. Please try again.';
}

/* ---------- Actions ---------- */
async function submit(e) {
  e.preventDefault();
  if (busy) return;
  clearMsg();

  if (!sb) {
    showMsg(configured
      ? 'Could not load the Supabase library. Check your internet connection.'
      : 'Add your SUPABASE_URL and SUPABASE_ANON_KEY in login.html first.');
    return;
  }

  const email = $('email').value.trim();
  const password = $('password').value;
  const fullName = $('fullName').value.trim();

  if (!EMAIL_RE.test(email)) { showMsg('Enter a valid email address.'); $('email').focus(); return; }
  if (password.length < 6)   { showMsg('Password must be at least 6 characters.'); $('password').focus(); return; }
  if (mode === 'signup' && !fullName) { showMsg('Enter your name so your roommates can recognise you.'); $('fullName').focus(); return; }

  try {
    if (mode === 'signin') {
      setBusy(true, 'Signing in…');
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      toast('Signed in. Redirecting…');
      location.replace(nextPage());
      return;
    }

    setBusy(true, 'Creating account…');
    const { data, error } = await sb.auth.signUp({
      email, password,
      options: { data: { full_name: fullName }, emailRedirectTo: location.origin + location.pathname.replace(/[^/]*$/, '') + 'login.html' }
    });
    if (error) throw error;

    // Supabase returns an empty identities list when the email is already taken.
    if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
      throw new Error('already registered');
    }

    if (data.session) {
      // Email confirmation is off: we are signed in, so save the name on the profile.
      try { await sb.from('profiles').update({ full_name: fullName }).eq('id', data.user.id); } catch {}
      toast('Account created. Redirecting…');
      location.replace(nextPage());
      return;
    }

    setMode('signin');
    showMsg('Account created. Check your email and click the confirmation link, then sign in.', 'success');
    $('password').value = '';
  } catch (err) {
    showMsg(friendly(err));
  } finally {
    setBusy(false, mode === 'signup' ? 'Create account' : 'Sign in');
  }
}

async function forgot() {
  clearMsg();
  if (!sb) { showMsg('Add your SUPABASE_URL and SUPABASE_ANON_KEY in login.html first.'); return; }
  const email = $('email').value.trim();
  if (!EMAIL_RE.test(email)) { showMsg('Enter your email above, then click “Forgot password?” again.'); $('email').focus(); return; }
  try {
    setBusy(true);
    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: location.origin + location.pathname
    });
    if (error) throw error;
    showMsg('If an account exists for that email, a reset link is on its way.', 'success');
  } catch (err) {
    showMsg(friendly(err));
  } finally {
    setBusy(false);
  }
}

/* ---------- Wire up ---------- */
$('form').addEventListener('submit', submit);
$('forgot').addEventListener('click', forgot);
for (const t of document.querySelectorAll('.tab')) t.addEventListener('click', () => setMode(t.dataset.mode));

$('toggle-pw').addEventListener('click', () => {
  const show = $('password').type === 'password';
  $('password').type = show ? 'text' : 'password';
  $('toggle-icon').textContent = show ? 'visibility_off' : 'visibility';
  $('toggle-pw').setAttribute('aria-pressed', show);
  $('toggle-pw').setAttribute('aria-label', show ? 'Hide password' : 'Show password');
});

setMode('signin');

// Already signed in? Skip the form.
if (sb) {
  sb.auth.getSession().then(({ data }) => { if (data && data.session) location.replace(nextPage()); }).catch(() => {});
} else if (!configured) {
  showMsg('Setup needed: add your SUPABASE_URL and SUPABASE_ANON_KEY at the top of the script in login.html.', 'error');
}

// Icon font ready (same pattern as the other pages)
(() => { const done = () => document.documentElement.classList.remove('icons-pending');
  try { Promise.race([document.fonts.load('24px "Material Symbols Outlined"'), new Promise(r => setTimeout(r, 3000))]).then(done, done); } catch { done(); } })();
})();
</script>
</body>
</html>
